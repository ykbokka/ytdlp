name: Build YTM Music Toolkit EXE

on:
  push:
    branches:
      - main
    paths:
      - "YTM_Music_Toolkit.pyw"
      - "EXE_Build_Kit/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: EXE_Build_Kit/requirements-build.txt

      - name: Prepare all build requirements
        shell: powershell
        run: .\EXE_Build_Kit\Download-Requirements.ps1

      - name: Assemble the standalone EXE
        shell: powershell
        run: .\EXE_Build_Kit\Build-EXE.ps1

      - name: Upload standalone EXE and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: YTM-Music-Toolkit-Windows-x64
          path: |
            EXE_Build_Kit/dist/YTM Music Toolkit.exe
            EXE_Build_Kit/build_workspace/build_manifest.txt
          if-no-files-found: error
          retention-days: 14
