name: Build self-contained Qt Quick EXE

on:
  push:
    branches:
      - self-contained-qt-exe-bundle
    paths:
      - "Qt_Quick_Migration/**"
      - ".github/workflows/qt-quick-exe-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Qt_Quick_Migration/**"
      - ".github/workflows/qt-quick-exe-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: Qt_Quick_Migration/requirements-build.txt

      - name: Create build environment
        shell: powershell
        run: python -m venv Qt_Quick_Migration/.venv

      - name: Parse PowerShell installer and bundler
        shell: powershell
        run: |
          $files = @(
            "Qt_Quick_Migration/Install-Dependencies.ps1",
            "Qt_Quick_Migration/Build-Prototype-EXE.ps1"
          )
          foreach ($file in $files) {
            $source = [System.IO.File]::ReadAllText((Resolve-Path $file))
            [void][scriptblock]::Create($source)
            Write-Host "PowerShell syntax passed: $file"
          }

      - name: Install Python packages and media tools
        shell: powershell
        run: .\Qt_Quick_Migration\Install-Dependencies.ps1

      - name: Build single-file executable
        shell: powershell
        run: .\Qt_Quick_Migration\Build-Prototype-EXE.ps1

      - name: Upload self-contained EXE
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Toolkit-Qt-Quick-Windows-x64
          path: Qt_Quick_Migration/dist/YouTube Toolkit Qt Preview.exe
          if-no-files-found: error
          retention-days: 14
