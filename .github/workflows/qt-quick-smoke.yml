name: Qt Quick migration smoke test

on:
  push:
    branches:
      - qt-quick-migration
    paths:
      - "Qt_Quick_Migration/**"
      - ".github/workflows/qt-quick-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Qt_Quick_Migration/**"
      - ".github/workflows/qt-quick-smoke.yml"
  workflow_dispatch:

jobs:
  qml-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Qt_Quick_Migration/requirements.txt

      - name: Install prototype dependencies
        run: python -m pip install -r Qt_Quick_Migration/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q Qt_Quick_Migration

      - name: Run backend regression tests
        working-directory: Qt_Quick_Migration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_backend.py test_ytmusic_resolver.py -v

      - name: Load QML in offscreen Qt Quick
        working-directory: Qt_Quick_Migration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_test.py
